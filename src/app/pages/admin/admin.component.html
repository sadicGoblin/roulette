<div class="container-page">
  <div class="card">
    <div class="cheader">
      <div class="logo-container full-width">
        <img src="../../../assets/logoentel.png" alt="Logo" />
      </div>
      <div class="htitle">
        <h3 class="barlow-medium">Admin | Listado de registros</h3>
      </div>
      <div class="header-actions">
        <button mat-raised-button color="accent" (click)="abrirModalQuemar()">
          Quemar Tickets
        </button>
      </div>
    </div>

    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Buscar en todos los campos</mat-label>
      <input
        matInput
        (keyup)="applyFilter($event)"
        placeholder="Escriba para buscar..."
      />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <!-- Position Column -->
      <ng-container matColumnDef="create">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let element">
          {{ element.create | dateFormat }}
        </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="firstName">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let element">{{ element.firstName }}</td>
      </ng-container>

      <!-- Weight Column -->
      <ng-container matColumnDef="lastName">
        <th mat-header-cell *matHeaderCellDef>Apellido</th>
        <td mat-cell *matCellDef="let element">{{ element.lastName }}</td>
      </ng-container>

      <!-- Phone Column -->
      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef>Teléfono</th>
        <td mat-cell *matCellDef="let element">{{ element.phone }}</td>
      </ng-container>

      <!-- Mail Column -->
      <ng-container matColumnDef="mail">
        <th mat-header-cell *matHeaderCellDef>Correo</th>
        <td mat-cell *matCellDef="let element">
          <a href="mailto:{{ element.mail }}" target="_blank">{{ element.mail }}</a>
        </td>
      </ng-container>

      <!-- Empresa Column -->
      <ng-container matColumnDef="empresa">
        <th mat-header-cell *matHeaderCellDef>Empresa</th>
        <td mat-cell *matCellDef="let element">{{ element.empresa }}</td>
      </ng-container>

      <!-- Code Column -->
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef>Code</th>
        <td
          mat-cell
          *matCellDef="let element"
          [class.tachado]="element.codeStatus === 'O'"
        >
          <app-code-template
            [codeStatus]="element.codeStatus"
            [code]="element.code"
            (codeClicked)="abrirModalQuemar($event)"
          ></app-code-template>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <mat-paginator
      [pageSizeOptions]="[10, 20, 50, 100, 1000]"
      showFirstLastButtons
    ></mat-paginator>

    <button (click)="exportarAExcel()" mat-raised-button color="primary">
      Exportar Planilla
    </button>

    <!-- <button
      (click)="eliminarBaseDatos()"
      mat-raised-button
      color="warn"
      style="margin-left: 10px"
    >
      Eliminar Base de Datos
    </button> -->
  </div>
</div>
